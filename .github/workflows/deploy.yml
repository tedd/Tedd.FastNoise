name: Deploy

# Push to `deploy` to publish the next automatically versioned NuGet package and
# a matching GitHub release of the designer. Pages is handled independently by
# pages.yml so a package failure cannot block documentation deployment.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Two deploys racing each other would contend for the same version and tag.
concurrency:
  group: package-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test src/Tedd.FastNoise.Tests -c Release

  package:
    name: package
    needs: verify
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set automatic package version
        id: version
        shell: pwsh
        run: |
          $projectPath = 'src/Tedd.FastNoise/Tedd.FastNoise.csproj'
          $project = [xml](Get-Content -LiteralPath $projectPath)
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) {
            throw "No Version element found in $projectPath."
          }

          $baseVersion = [version]$versionNode.InnerText
          # A workflow rerun retains its version; each new deploy run advances the patch.
          $packageVersion = '{0}.{1}.{2}' -f $baseVersion.Major, $baseVersion.Minor, ($baseVersion.Build + [int]$env:GITHUB_RUN_NUMBER)
          $versionNode.InnerText = $packageVersion
          $project.Save((Resolve-Path -LiteralPath $projectPath))
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing Tedd.FastNoise $packageVersion"

      - run: dotnet pack src/Tedd.FastNoise -c Release -o artifacts/packages

      # Self-contained so the download runs on a machine with no .NET installed,
      # which is the whole point of shipping a designer to people evaluating the library.
      - name: Publish the designer
        run: >
          dotnet publish src/Tedd.FastNoise.Designer -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o artifacts/designer

      - name: Zip the designer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Compress-Archive -Path artifacts/designer/* -DestinationPath artifacts/release/Tedd.FastNoise.Designer-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*

      - uses: actions/upload-artifact@v4
        with:
          name: designer
          path: artifacts/release/*

  nuget:
    name: publish to nuget
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Apply package version
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $projectPath = 'src/Tedd.FastNoise/Tedd.FastNoise.csproj'
          $project = [xml](Get-Content -LiteralPath $projectPath)
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) {
            throw "No Version element found in $projectPath."
          }
          $versionNode.InnerText = $env:PACKAGE_VERSION
          $project.Save((Resolve-Path -LiteralPath $projectPath))

      # NuGet.org validates this workflow through OIDC and returns a one-hour API key.
      # No long-lived NuGet credential is stored in GitHub.
      - name: Log in to NuGet.org with OIDC
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: tedd

      - name: Publish on version change
        id: publish_nuget
        continue-on-error: true
        # publish-nuget-neo has no v2 tag. Pin the current v2 implementation on main;
        # v1 refers to the obsolete implementation that emits `dotnet dotnet nuget push`.
        uses: tedd/publish-nuget-neo@1a65ed85a859c9f4905b61c58afe6b1dcbb74ae4
        with:
          NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          PROJECT_FILE_PATH: src/Tedd.FastNoise/Tedd.FastNoise.csproj
          PACKAGE_NAME: Tedd.FastNoise
          NUGET_SOURCE: https://api.nuget.org
          INCLUDE_SYMBOLS: true
          TAG_COMMIT: true
          TAG_FORMAT: v*
          REBUILD_PROJECT: false
          LOG_LEVEL: INFO

      # The current action suppresses dotnet's server response when a push fails. A direct retry
      # preserves the diagnostic, handles a transient failure, and completes the tag operation.
      - name: Retry failed publish
        if: steps.publish_nuget.outcome == 'failure'
        shell: pwsh
        env:
          NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $packages = @(
            Get-Item -LiteralPath "src/Tedd.FastNoise/Tedd.FastNoise.$env:PACKAGE_VERSION.nupkg"
            Get-Item -LiteralPath "src/Tedd.FastNoise/Tedd.FastNoise.$env:PACKAGE_VERSION.snupkg"
          )
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet publish failed for $($package.Name) with exit code $LASTEXITCODE."
            }
          }

          $tag = "v$env:PACKAGE_VERSION"
          if (-not (git tag --list $tag)) {
            git tag $tag
            if ($LASTEXITCODE -ne 0) {
              throw "Creating tag $tag failed."
            }
          }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) {
            throw "Pushing tag $tag failed."
          }

  release:
    name: publish the app
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: designer
          path: release

      # A rolling tag so the site can link to a stable
      # /releases/latest/download/... URL without being regenerated each version.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: designer-v${{ needs.package.outputs.version }}
          name: Designer ${{ needs.package.outputs.version }}
          body: |
            The Tedd.FastNoise designer, built from `${{ github.sha }}`.

            Self-contained Windows x64 build: unzip and run `Tedd.FastNoise.Designer.exe`.
            No .NET installation required.
          files: release/*
          make_latest: true
