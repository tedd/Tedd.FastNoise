name: Deploy

# Dispatch after local validation to publish both packages and the designer.
# Pages publishes independently when the deploy branch changes.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Two deploys racing each other would contend for the same version and tag.
concurrency:
  group: package-deploy
  cancel-in-progress: false

jobs:
  package:
    name: package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set automatic package version
        id: version
        shell: pwsh
        run: |
          $projectPath = 'src/Tedd.FastNoise/Tedd.FastNoise.csproj'
          $project = [xml](Get-Content -LiteralPath $projectPath)
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) {
            throw "No Version element found in $projectPath."
          }

          $baseVersion = [version]$versionNode.InnerText
          # A workflow rerun retains its version; each new deploy run advances the patch.
          $packageVersion = '{0}.{1}.{2}' -f $baseVersion.Major, $baseVersion.Minor, ($baseVersion.Build + [int]$env:GITHUB_RUN_NUMBER)
          $versionNode.InnerText = $packageVersion
          $project.Save((Resolve-Path -LiteralPath $projectPath))
          $gpuPath = 'src/Tedd.FastNoise.Gpu/Tedd.FastNoise.Gpu.csproj'
          $gpuProject = [xml](Get-Content -LiteralPath $gpuPath)
          $gpuProject.SelectSingleNode('/Project/PropertyGroup/Version').InnerText = $packageVersion
          $gpuProject.Save((Resolve-Path -LiteralPath $gpuPath))
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing Tedd.FastNoise $packageVersion"

      - run: dotnet pack src/Tedd.FastNoise -c Release -o artifacts/packages
      - run: dotnet pack src/Tedd.FastNoise.Gpu -c Release -o artifacts/packages

      # Self-contained so the download runs on a machine with no .NET installed,
      # which is the whole point of shipping a designer to people evaluating the library.
      - name: Publish the designer
        run: >
          dotnet publish src/Tedd.FastNoise.Designer -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o artifacts/designer

      - name: Zip the designer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Compress-Archive -Path artifacts/designer/* -DestinationPath artifacts/release/Tedd.FastNoise.Designer-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*

      - uses: actions/upload-artifact@v4
        with:
          name: designer
          path: artifacts/release/*

  nuget:
    name: publish CPU and GPU packages
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      # Publish the exact artifacts produced by the package job, with one shared version.
      - name: Log in to NuGet.org with OIDC
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: tedd

      - name: Publish packages and symbols
        shell: pwsh
        env:
          NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          foreach ($id in @('Tedd.FastNoise', 'Tedd.FastNoise.Gpu')) {
            foreach ($extension in @('nupkg', 'snupkg')) {
              $package = Get-Item -LiteralPath "artifacts/packages/$id.$env:PACKAGE_VERSION.$extension"
              dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_KEY --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "Publishing $($package.Name) failed." }
            }
          }

      - name: Tag the published version
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $tag = "v$env:PACKAGE_VERSION"
          if (-not (git tag --list $tag)) {
            git tag $tag
            if ($LASTEXITCODE -ne 0) { throw "Creating $tag failed." }
          }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { throw "Pushing $tag failed." }

  release:
    name: publish the app
    needs: [package, nuget]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: designer
          path: release

      # A rolling tag so the site can link to a stable
      # /releases/latest/download/... URL without being regenerated each version.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: designer-v${{ needs.package.outputs.version }}
          name: Designer ${{ needs.package.outputs.version }}
          body: |
            The Tedd.FastNoise designer, built from `${{ github.sha }}`.

            Self-contained Windows x64 build: unzip and run `Tedd.FastNoise.Designer.exe`.
            No .NET installation required.
          files: release/*
          make_latest: true
