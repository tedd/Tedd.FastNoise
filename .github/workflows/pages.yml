name: Pages

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: render and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Every image is generated by the version of Tedd.FastNoise being documented.
      - name: Render 2D and 3D samples
        run: dotnet run -c Release --project tools/Tedd.FastNoise.Gallery -- docs/gallery

      # Hosted runners use Mesa's Vulkan software device to execute the same compute sample.
      - name: Install Vulkan compute runtime
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Render Vulkan terrain samples
        run: dotnet run -c Release --project samples/Tedd.FastNoise.Gpu.Sample -- docs/gallery

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
